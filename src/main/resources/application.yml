spring:
  application:
    name: payflow

  datasource:
    url: jdbc:postgresql://localhost:5432/payflow
    username: postgres
    password: 12345

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8000

management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  secret: "java-spring-app-to-seniorty-level"
  expiration: 3600000